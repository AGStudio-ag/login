<style>
:root{
  --bg:#f5f1e8; --panel:#fffdf7; --panel2:#faf6ec; --ink:#211d18; --ink2:#514a40;
  --muted:#8a8175; --line:#ded4c0; --line2:#c9bca3;
  --red:#a83226; --red2:#c45a49; --redw:#f6e7e1;
  --gold:#94732a; --goldw:#f5ecd3;
  --jade:#386b58; --jadew:#e3eee8;
  --blue:#355f86; --bluew:#e5edf5;
  --shadow:0 1px 2px rgba(40,32,20,.05),0 10px 28px -20px rgba(40,32,20,.5);
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",Georgia,serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
html[data-theme="dark"]{
  --bg:#14130f; --panel:#1d1b16; --panel2:#242118; --ink:#efe8d8; --ink2:#c6bdac;
  --muted:#8f877a; --line:#37322a; --line2:#4a4337;
  --red:#e07560; --red2:#e89583; --redw:#33201b;
  --gold:#d8b264; --goldw:#2c2617;
  --jade:#8ebba6; --jadew:#1b2721;
  --blue:#8fb4dd; --bluew:#1b2530;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:inherit}
#app{display:flex;min-height:100vh}
#side{width:220px;flex:0 0 220px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.04em;line-height:1.35;margin-bottom:2px}
.brand em{font-style:normal;color:var(--red)}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:20px}
.nav-label{font-size:10px;letter-spacing:.16em;color:var(--muted);margin:16px 0 6px 8px}
.nav button{display:flex;width:100%;align-items:center;gap:9px;border:0;background:transparent;color:var(--ink2);padding:8px 10px;border-radius:8px;font-size:13px;text-align:left;transition:.15s}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button.on{background:var(--redw);color:var(--red);font-weight:700}
.nav .ic{width:18px;text-align:center;font-size:14px;opacity:.85}
.nav .cnt{margin-left:auto;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress-box{margin-top:20px;padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.progress-box .t{font-size:11px;color:var(--muted);margin-bottom:7px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);width:0;transition:.3s}
.pnum{font-family:var(--serif);font-size:21px;font-weight:700;margin-top:6px}
.pnum small{font-size:11px;color:var(--muted);font-family:var(--sans);font-weight:400}
.side-foot{margin-top:18px;font-size:10px;color:var(--muted);line-height:1.6}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:180px;max-width:420px;padding:8px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);color:var(--ink);font-size:13px;outline:none}
#q:focus{border-color:var(--red)}
.chip{border:1px solid var(--line2);background:var(--panel);color:var(--ink2);border-radius:8px;padding:7px 11px;font-size:12px;white-space:nowrap}
.chip:hover{border-color:var(--red);color:var(--red)}
.chip.primary{background:var(--red);border-color:var(--red);color:#fff}
.stat{font-size:11px;color:var(--muted);white-space:nowrap}
.stat b{color:var(--ink);font-size:13px}
#view{padding:24px 26px 70px;max-width:1180px;width:100%;margin:0 auto}
h1.vt{font-family:var(--serif);font-size:25px;margin:0 0 4px;letter-spacing:.02em}
p.vsub{color:var(--muted);font-size:12px;margin:0 0 22px}
.sec-t{font-family:var(--serif);font-size:16px;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
.sec-t:before{content:"";width:3px;height:15px;background:var(--red);border-radius:2px}
.hint{background:var(--goldw);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--ink2);margin:12px 0 18px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 7px;font-size:14px;font-family:var(--serif)}
.card p{margin:4px 0;font-size:12.5px;color:var(--ink2)}
.tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);margin-right:5px}
.tag.red{background:var(--redw);border-color:transparent;color:var(--red)}
.tag.gold{background:var(--goldw);border-color:transparent;color:var(--gold)}
.tag.jade{background:var(--jadew);border-color:transparent;color:var(--jade)}
.tag.blue{background:var(--bluew);border-color:transparent;color:var(--blue)}
/* routes */
.route{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:start}
.route .time{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--red);line-height:1.2}
.route .time small{display:block;font-size:10px;color:var(--muted);font-family:var(--sans);font-weight:400}
.route ol{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink2)}
.route li{margin:3px 0}
/* mind map */
.maproot{text-align:center;margin:6px 0 16px}
.maproot .core{display:inline-block;background:var(--red);color:#fff;font-family:var(--serif);font-size:16px;font-weight:700;padding:9px 24px;border-radius:12px;box-shadow:var(--shadow)}
.maproot .core small{display:block;font-family:var(--sans);font-size:10px;font-weight:400;opacity:.85}
.mapline{height:16px;border-left:2px solid var(--line2);width:0;margin:0 auto}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:11px;position:relative}
.branches:before{content:"";position:absolute;top:-16px;left:8%;right:8%;height:2px;background:var(--line2)}
.branch{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--jade);border-radius:10px;padding:11px 13px;text-align:left;color:var(--ink);box-shadow:var(--shadow);transition:.15s}
.branch:hover{transform:translateY(-2px);border-color:var(--red)}
.branch .bn{font-family:var(--serif);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.branch .bn span{font-size:10px;color:var(--muted);font-family:var(--sans);font-weight:400}
.branch .stars{color:var(--gold);font-size:11px;letter-spacing:1px}
.branch .leaves{font-size:11px;color:var(--ink2);line-height:1.65;margin-top:6px}
.tree{margin-top:8px}
.tree details{border-bottom:1px solid var(--line);padding:7px 2px}
.tree summary{cursor:pointer;font-family:var(--serif);font-weight:700;font-size:14px}
.tree .items{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tree .items button{font-size:11px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);border-radius:6px;padding:3px 8px}
.tree .items button:hover{border-color:var(--red);color:var(--red)}
/* flashcards */
.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select,.toolbar input{padding:6px 9px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);color:var(--ink);font-size:12px}
.toolbar .seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.toolbar .seg button{border:0;background:var(--panel);color:var(--ink2);padding:6px 10px;font-size:12px;border-right:1px solid var(--line2)}
.toolbar .seg button:last-child{border-right:0}
.toolbar .seg button.on{background:var(--red);color:#fff}
.fc{perspective:1200px;min-height:172px;cursor:pointer}
.fc-in{position:relative;transition:transform .38s;transform-style:preserve-3d;min-height:172px}
.fc.flipped .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow);overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--panel2)}
.fc .num{font-size:10px;color:var(--muted);letter-spacing:.08em}
.fc .ft{font-family:var(--serif);font-size:16px;font-weight:700;margin:5px 0 8px}
.fc .fl{font-size:12px;color:var(--ink2);line-height:1.65;margin:3px 0}
.fc .mn{font-size:12px;color:var(--gold);background:var(--goldw);padding:5px 9px;border-radius:6px;margin-top:9px;display:inline-block}
.fc .flip-hint{position:absolute;bottom:8px;right:12px;font-size:10px;color:var(--muted)}
.fc-actions{display:flex;gap:6px;margin-top:7px}
.fc-actions button{flex:1;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);border-radius:7px;padding:5px;font-size:11px}
.fc-actions button.yes:hover{background:var(--jadew);color:var(--jade);border-color:var(--jade)}
.fc-actions button.no:hover{background:var(--redw);color:var(--red);border-color:var(--red)}
.fcwrap.known .face.front{background:var(--jadew);border-color:var(--jade)}
/* drill */
.drill{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px;box-shadow:var(--shadow);max-width:720px;margin:0 auto;text-align:center}
.drill .dt{font-family:var(--serif);font-size:22px;margin:10px 0}
.drill .da{font-size:14px;color:var(--ink2);text-align:left;background:var(--panel2);border-radius:9px;padding:14px;margin:14px 0;min-height:80px;line-height:1.8}
.drill .da div{margin:4px 0}
.drill .dm{color:var(--gold);font-size:13px;margin-top:10px}
/* timeline */
.mnstrip{background:var(--goldw);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--serif);font-size:13px;line-height:2;color:var(--ink);margin-bottom:18px}
.mnstrip span{display:inline-block;margin-right:12px;white-space:nowrap}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tlitem{position:relative;margin-bottom:9px}
.tlitem:before{content:"";position:absolute;left:-20px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--jade);border:2px solid var(--panel)}
.tlitem .th{display:flex;gap:10px;align-items:baseline;cursor:pointer}
.tlitem .yr{font-family:var(--serif);font-weight:700;color:var(--red);min-width:46px;font-size:14px}
.tlitem .nm{font-family:var(--serif);font-weight:700;font-size:14px}
.tlitem .sum{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52%}
.tlitem ul{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--ink2);line-height:1.7;display:none}
.tlitem.open ul{display:block}
/* quiz */
.quizbox{max-width:760px;margin:0 auto}
.qtext{font-family:var(--serif);font-size:19px;line-height:1.75;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:var(--shadow);min-height:110px;display:flex;align-items:center}
.qbtns{display:flex;gap:10px;margin:14px 0}
.qbtns button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);font-size:15px;font-weight:700;color:var(--ink)}
.qbtns button.g:hover{background:var(--jadew);border-color:var(--jade)}
.qbtns button.b:hover{background:var(--redw);border-color:var(--red)}
.feedback{padding:10px 14px;border-radius:9px;font-size:13px;min-height:42px}
.feedback.ok{background:var(--jadew);color:var(--jade)}
.feedback.bad{background:var(--redw);color:var(--red)}
/* traps & mnemonic */
.trap{border-top:3px solid var(--blue)}
.trap .sig{font-size:11.5px;color:var(--blue);margin:6px 0}
.trap .eg{font-size:11.5px;color:var(--muted);border-left:2px solid var(--line2);padding-left:9px;margin-top:7px;line-height:1.6}
.wordcloud{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wordcloud span{background:var(--redw);color:var(--red);border-radius:6px;padding:3px 9px;font-size:12px;font-weight:700}
.mncard{border-left:3px solid var(--gold)}
.mncard .m{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--gold)}
.mncard .a{font-size:12px;color:var(--ink2);margin-top:5px}
.z02{font-size:12.5px;color:var(--ink2);line-height:1.75;white-space:pre-wrap}
.z02 .tt{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);display:block;margin-bottom:6px}
/* search results */
.sres{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 13px;margin-bottom:7px;font-size:12.5px;cursor:pointer}
.sres:hover{border-color:var(--red)}
.sres .k{font-size:10px;color:var(--muted);margin-right:8px}
.empty{color:var(--muted);font-size:13px;padding:28px;text-align:center}
.hotrow{display:grid;grid-template-columns:22px 132px 86px 1fr 112px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}
.hotrow:last-child{border-bottom:0}
.hn{color:var(--muted);font-size:10px;text-align:right}
.ht{font-family:var(--serif);font-weight:700}
.hbar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--red);border-radius:99px}
.hc{font-size:10px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.yearcard .yt{font-family:var(--serif);font-size:17px;color:var(--red);font-weight:700}
.yearcard .yk{font-size:11.5px;color:var(--ink2);line-height:1.9;margin-top:4px}
.footer-note{font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin-top:34px;padding-top:12px;line-height:1.7}
@media(max-width:820px){
  #app{flex-direction:column}
  #side{width:100%;height:auto;position:static;flex:none;border-right:0;border-bottom:1px solid var(--line);padding:12px}
  .nav{display:flex;overflow:auto;gap:5px}
  .nav-label{display:none}
  .nav button{width:auto;white-space:nowrap;flex:none}
  .nav .cnt{display:none}
  .progress-box,.side-foot{display:none}
  #view{padding:18px 14px 60px}
  #top{padding:9px 14px}
}
@media(max-width:820px){.hotrow{grid-template-columns:18px 1fr auto}.hotrow .hbar,.hotrow .hc{display:none}}
@media print{#side,#top{display:none}#view{padding:0}}
</style>

引起的"], "mnemonic": "", "ch": "政经"}, {"num": "028", "title": "价值规律的作用", "sec": "政经", "lines": ["价值规律在市场配置资源过程中的作用表现在：", "（1）自发地调节生产资料和劳动力在社会各生产部门之间的分配比例", "（2）自发地刺激社会生产力的发展", "（3）自发地调节社会收入的分配", "自发地调节雇佣工人与资本家之间的利益再分配（错误）", "比如资本家压榨数学答疑，让答疑干活多但是发工资少，这种现象不会被价值规律所调节"], "mnemonic": "", "ch": "政经"}, {"num": "029", "title": "超额和相对剩余价值", "sec": "政经", "lines": ["在资本主义商品生产条件下，单个资本家改进技术、改善管理的主观动机是追求超额剩余价值，但其客观后果则是整个社会各个生产部门的劳动生产率普遍提高，导致生活资料的价值下降和补偿劳动力价值的必要劳动时间缩短，而剩余劳动时间相对延长，整个资本家阶级普遍获得更多的相对剩余价值。", "助记：超额对应原因，个别", "相对对应结果，社会"], "mnemonic": "超额=原因·个别；相对=结果·社会", "ch": "政经"}, {"num": "030", "title": "劳动生产率", "sec": "政经", "lines": ["劳动生产率指的是劳动者生产使用价值的效率。", "它的高低可以用单位劳动时间内生产的商品数量来测量，也可以用单位商品中所耗费的劳动时间来测量。", "通俗理解方式", "第一种：单位时间内，你做得多不多？", "有人一分钟一个，有人一分钟一亿个。", "第二种：单位商品，你多久做出来？你做得快不快？有人一秒钟就做一个，有人一小时才做一个。", "在单位劳动时间内，劳动者耗费的劳动量不变，生产", "的价值总量也不变。", "生产率", "产出数量", "生产率", "做单个商品花费时间", "单个商品的价值"], "mnemonic": "", "ch": "政经"}, {"num": "031", "title": "不变资本和可变资本", "sec": "政经", "lines": ["根据资本在剩余价值生产中所起的不同作用", "可以将资本划分为不变资本与可变资本", "不变资本（c）：以生产资料形态存在的资本", "这部分资本在生产过程中，不改变自己的价值量，不发生增殖", "不变资本的价值是具体劳动转移到新产品中（可一次转移，也可多次转移）", "可变资本（v）：用来购买劳动力的那部分资本", "剩余价值是由可变资本雇佣的劳动者创造的", "可变资本的价值是工人的劳动再生产出来的（可变资本是工人干活干出来的）", "【剩余价值】是雇佣工人所创造并被资本家无偿占有的超过劳动力价值的那部分价值，是雇佣工人剩余劳动的凝结", "资本的技术构成：由生产的技术水平所决定的生产资料和劳动力之间的比例。", "（几台烤箱 + 多少面粉 VS 几个面包师傅）", "资本的价值构成：不变资本（c）和可变资本（v）之间的比例。", "（买烤箱和面粉花了多少钱 VS 给师傅发了多少工资）", "资本的有机构成：由资本的技术构成决定并反映技术构成变化的资本价值构成，即c：v。", "（花钱的比例（c：v），是由烤箱和师傅的搭配方式决定的）", "在资本主义生产过程中", "资本有机构成的提高是一般趋势，这是由资本的本性决定的", "展开理解，当面包老板升级设备时：他的技术构成提高了（机器", "多了先进了，需要的师傅", "少了）。", "这个变化必然导致他的价值构成也提高了", "（买机器的钱的比例，相对于工资的比例，大大增加了）。", "我们就说，他的面包店的资本有有机成提高了。", "（拓展：整个社会资本有机构成普遍提高会形成相对过剩人口）", "技术变，价值变，有机也就变", "技术不变，价值变，有机就不变"], "mnemonic": "技术变→价值变→有机变", "ch": "政经"}, {"num": "033", "title": "政经计算", "sec": "计算", "lines": ["不变资本C 可变资本V 剩余价值M", "投资=成本=C+V", "有机构成C比V", "剩余价值率M比V", "利润=M", "蓝色是已知条件，红色为所求", "某资本家投资100万元，其中既包括不变资本（c）也包括可变资本（v），即c+v=100万元。", "其预付资本的有机构成是3:1，资本有机构成公式是c：v，即c：v=3:1，结合前文已知c+v=100万元，则不变资本c为75万元，可变资本v为25万元。", "该资本家每次投资的剩余价值率为200%，即m/v=200%，则每次投资的剩余价值m为50万元。", "利润与剩余价值在量上是一样的，故该资本家每次投资的利润为50万元。"], "mnemonic": "", "ch": "政经"}, {"num": "032", "title": "平均利润", "sec": "计算", "lines": ["平均利润的形成原因：不同生产部门资本家之间的竞争", "扩展：超额利润的形成原因", "同一部门内不同企业之间的竞争", "理解：为了得到尽可能高的利润率和尽可能多的利润，不同生产部门（通俗理解：不同“赛道”）的资本家之间必然展开激烈的竞争，大量资本必然从利润率低的部门转投到利润率高的部门，从而导致利润率平均化。", "注意：不同“赛道”、同一“赛道”是网络用语，非专业术语，只", "是帮助大家理解这个概念。", "平均利润形成后：商品价值就转化为生产价格", "价值规律的实现形式发生了变化", "每个资本家所得利润的多少不仅取决于他对本企业工", "人的剥削程度，而且取决于整个资产阶级对整个工人阶级的剥削程度", "生产价格不再随着商品价值的变化而变动", "每一个部门获得的利润都等于该部门生产的剩余价值"], "mnemonic": "", "ch": "政经"}, {"num": "034", "title": "绝对和相对剩余价值计算", "sec": "计算", "lines": ["绝对剩余价值生产方法，比较大胆，总的工作时间延长。相对剩余价值生产方法，比较隐蔽，工作日时间不变。绝对剩余价值的生产和相对剩余价值的生产都是依靠", "延长工人的剩余劳动时间获得的。", "剩余价值率=剩余劳动时间÷必要劳动时间", "若原工作时间8小时，必要劳动时间4小时，剩余劳动时间4小时", "采用【绝对剩余价值】生产方法，使剩余劳动时间延长2小时", "延长劳动时间:8+2", "剩余价值率=6（总时长为10剪掉必要的4）÷4×100%=150%", "采用【相对剩余价值】生产方法，使剩余劳动时间延长2小时", "（通过技术在总时长不变的情况下缩短必要劳动时间）必要劳动时间=4-2", "剩余价值率=6（8-2）÷2×100%=300%"], "mnemonic": "", "ch": "政经"}]}, {"name": "国际", "title": "国际 · 科社", "cards": [{"num": "035", "title": "战时共产主义与新经济政策", "sec": "国际", "lines": ["战时共产主义：余粮收集制、取消商品货币关系", "——更好的供给军队作战", "新经济政策（列宁）：恢复商品货币关系，发展资本主义——战后迅速活跃经济", "新经济政策的主要特征是发展商品经济", "苏联模式（斯大林）：农业合作化", "——进一步发展社会主义", "列宁为社会主义奠定了基础，但列宁并未发展社会主义", "新经济政策（和战时作比较）", "农业：粮食税制取代余粮收集制", "不再全部收走，交完税了多的归你，允许农民自由出卖余粮", "工业：", "1.部分恢复私营经济", "允许私人经营中小企业，但关系国家命脉的企业仍归国家所有", "2.实行国家资本主义", "采取租让制和租借制，允许外资企业管理国家暂时无力经营的企业", "贸易：允许自由贸易（废除了国家配给和国家贸易垄", "断制）", "分配：实行按劳分配", "流通：恢复商品货币关系"], "mnemonic": "", "ch": "国际"}, {"num": "036", "title": "巴黎公社", "sec": "国际", "lines": ["1871年爆发的巴黎公社革命，是第一国际精神的产儿，是无产阶级夺取政权的第一次伟大尝试。", "特别是采取了两项重要措施，用以防止国家机关工作人员由社会公仆变为社会主人：一是规定所有公职人员无论职位高低，实行全面的选举制和撤换制；", "二是取消高薪制，规定任何工作人员年薪不得超过熟练工人的工薪水平。", "要点：巴黎公社建立的是政权，不是政党", "防止公仆变主人的两项措施与人相关，即人的工资和", "职位，取消高薪，选举撤换", "辨析：俄国十月革命才建立苏维埃大会制度", "巴黎公社革命源于民族矛盾和阶级斗争激化，不是第一国际发动和领导，只是受第一国际精神影响。"], "mnemonic": "", "ch": "国际"}]}, {"name": "史纲", "title": "史纲", "cards": [{"num": "038", "title": "斗争", "sec": "早期", "lines": ["三元里人民的抗英斗争是中国近代史上中国人民第一次大规模的反侵略武装斗争", "太平天国农民运动是中国近代历史上第一次反对国内封建势力和外国侵略势力的斗争", "失败的根本原因：农民阶级自身的阶级局限性"], "mnemonic": "", "ch": "史纲"}, {"num": "039", "title": "边疆危机", "sec": "早期", "lines": ["⑲世纪70至80年代", "列强从侵占中国周边邻国发展到蚕食中国边疆地区", "使中国陷入“边疆危机”", "甲午战争的惨败使中国陷入“边疆危机”"], "mnemonic": "", "ch": "史纲"}, {"num": "040", "title": "洋务运动", "sec": "早期", "lines": ["洋务派提出“自强”“求富”的主张（也是目标）", "洋务运动的指导思想（冯桂芬提出）", "“中学为体，西学为用”", "通过所掌握的国家权力集中力量优先发展军事工业洋务派兴办洋务事业首先是为了购买和制造洋枪洋炮以镇压农民起义，主要目的是维护封建统治", "洋务运动失败的主要原因：洋务运动具有封建性（决定）", "洋务运动对列强具有依赖性", "洋务企业的管理具有腐朽性"], "mnemonic": "缝衣服：封建性·依赖性·腐朽性", "ch": "史纲"}, {"num": "041", "title": "林则徐严复魏源郑观应", "sec": "早期", "lines": ["徐四睁眼见阎王喂海狮郑观应是公主", "林则徐：《四洲志》睁眼看世界第一人", "严复：救亡图存", "魏源：《海国图志》“师夷长技以制夷”", "开创了中国近代向西方学习的新风", "郑观应：《盛世危言》“君民共主”", "追求实行民主共和制度的思想"], "mnemonic": "徐四睁眼见阎王喂海狮 / 郑观应是公主", "ch": "史纲"}, {"num": "042", "title": "论战", "sec": "早期", "lines": ["维新派与守旧派的论战", "是近代中国资产阶级思想与封建主义思想的第一次正面交锋", "维新派与守旧派论战内容：要不要变法（中心）；", "要不要兴民权、设议院、实行君主立宪（后来变法中没有采纳）；", "要不要废八股、改科举和兴西学。（注意不是废科举，清末“新政”才废除科举）", "维新派与洋务派分歧的实质是要不要学习西方的政治制度与思想文化", "维新派技术思想都学，洋务派只学技术不学思想", "维新派与革命派的论战", "这次论战划清了革命与改良的界限，传播了民主革命思想，促进了革命形势的发展", "但同时也暴露了革命派在思想理论方面的弱点，即不敢反帝反封建。", "内容：要不要以革命手段推翻清王朝（这是双方论战的焦点）要不要推翻帝制，实行共和", "要不要社会革命"], "mnemonic": "", "ch": "史纲"}, {"num": "043", "title": "早期信仰马克思主义的人物", "sec": "早期", "lines": ["中国早期信仰马克思主义的人物，主要有三种类型：新文化运动的精神领袖，主要代表人物是李大钊、陈独秀", "五四爱国运动的左翼骨干，主要代表为毛泽东等", "原中国同盟会会员、辛亥革命时期的活动家，其代表", "为董必武等", "其主体部分是：五四爱国运动的左翼骨干"], "mnemonic": "", "ch": "史纲"}, {"num": "044", "title": "新文化运动及五四运动", "sec": "早期", "lines": ["新文化运动的倡导者", "（1）以进化论观点和个性解放思想为主要武器", "（2）批判孔学，是为了给中国发展资本主义扫清障碍，但没彻底否定孔学的历史作用", "屁孔发紫", "（3）大力提倡新道德、反对旧道德，提倡新文学、反对旧文学，包括提倡白话文、反对文言文。提倡民主、反对专制，提倡科学、反对迷信盲从", "（4）五四以前的新文化运动局限性：①提倡资产阶级民主主义", "②把改造国民性置于优先地位", "③还没有马克思主义", "后来十月革命给中国送来了马克思主义", "五四以后的新文化运动则发展到了一个新阶段", "马克思主义开始逐步地在思想文化领域中发挥指导作用", "五四运动的直接导火线：巴黎和会上中国外交的失败", "李大钊率先在中国大地上举起马克思主义旗帜", "其发表的《我的马克思主义观》标志着马克思主义在中国进入一个比较系统的传播阶段", "十月革命使中国先进分子从资产阶级民主主义转向社", "会主义"], "mnemonic": "", "ch": "史纲"}, {"num": "045", "title": "觉醒", "sec": "早期", "lines": ["中日甲午战争 1895", "促使中国人民的民族意识开始普遍觉醒", "五四运动 1919", "中华民族自鸦片战争以来的第一次全面觉醒"], "mnemonic": "", "ch": "史纲"}, {"num": "046", "title": "工人罢工运动", "sec": "早期", "lines": ["中国工人运动的第一个高潮（海员到京汉）", "1922.1香港海员—起点", "1922.9安源路矿—完全胜利", "1922.10开滦五矿—非完全胜利", "1923.2京汉铁路—终点（高潮）", "持续时间最长的罢工:1925-1926省港大罢工", "慕容云海是起点张翰是终点六胜五不胜省港最长"], "mnemonic": "慕容云海是起点，张翰是终点；六胜五不胜；省港最长", "ch": "史纲"}, {"num": "047", "title": "孙中山", "sec": "大革命", "lines": ["第一个响亮喊出“振兴中华”的口号", "创立兴中会（第一个）、同盟会", "提出民族、民权、民生的三民主义", "领导了辛亥革命", "1911年，在他领导和影响下，震惊世界的辛亥革命取得成功，推翻了清王朝统治，结束了统治中国几千年的君主专制制度", "中国共产党成立后，孙中山先生同中国共产党人真诚合作", "在中国共产党帮助下，把旧三民主义发展为新三民主义实行联俄、联共、扶助农工三大政策", "孙中山改组国民党，促成第一次国共合作，为后来北", "伐创造条件，推动反帝反封建革命前进", "（北伐战争是在孙中山逝世之后发生的，不由孙中山发动）"], "mnemonic": "", "ch": "史纲"}, {"num": "048", "title": "新旧三民主义", "sec": "大革命", "lines": ["旧三民主义：驱除鞑虏，恢复中华", "创立民国", "平均地权", "旧三民主义的局限：民族主义的局限性", "没有从正面鲜明地提出反对帝国主义的主张", "没有保证广大劳动群众在国家中的地位", "民生主义指的是“平均地权”，其局限性表现在", "没有正面触及封建土地所有制，不能满足广大农民的土地要求", "新三民主义：", "民族：突出反帝内容，对外实行民族独立，对内主张", "民族平等", "民权：民主权利“为一般平民所共有”，不应为“少", "数人所得私”", "民生：平均地权和节制资本（后又提出耕者有其田）", "并提出改善工农生活状况", "三民无主", "新旧三民主义，都是民族，民生，民权。从来没有民主，有民主就错", "新三民主义的政纲同中国共产党在民主革命阶段的纲", "领基本一致，因而有了国共合作的政治基础"], "mnemonic": "", "ch": "史纲"}, {"num": "049", "title": "旧民主主义革命的终结和新民主主义革命的开端", "sec": "大革命", "lines": ["护法运动的失败不仅是孙中山个人的失败", "也标志着整个中国民族资产阶级领导的旧民主主义革命的终结", "使孙中山认识到“南与北如一丘之貉”，想依靠南方", "军阀来反对北洋军阀行不通的事件是护法运动", "五四运动成为中国革命的新阶段即新民主主义革命阶", "段的开端", "无产阶级的领导权是中国革命的中心问题，也是新民主主义革命理论的核心问题。", "区别新、旧两种不同范畴的民主主义革命的根本标志是，革命的领导权是掌握在无产阶级手中还是掌握在资产阶级手中。", "一定要注意，虽然“新民主主义革命”有个“新”字，但其性质依然是资产阶级民主主义革命（由社会性质、革命对象、革命任务等决定）。", "但是，中国革命已不是旧式的、一般的资产阶级民主主义革命，而是新式的、特殊的资产阶级民主主义革命。"], "mnemonic": "", "ch": "史纲"}, {"num": "051", "title": "中国革命能坚持和发展的原因", "sec": "土地革命", "lines": ["在大革命失败、白色恐怖极其严重的条件下", "中国革命之所以能够得到坚持和发展", "根本原因就在于中国共产党", "紧紧地依靠农民领导农民进行了土地制度的革命"], "mnemonic": "", "ch": "史纲"}, {"num": "052", "title": "秋收起义与南昌起义", "sec": "土地革命", "lines": ["区别：秋收起义：【工农革命军】的旗帜", "南昌起义：【国民革命军】的旗帜", "秋收起义不仅是军队的行动，而且有数量众多的工农", "武装参加", " ": "意识是物质的产物，但又不是物质本身。", "theme": "物质·意识·世界"}, {"text": "实践是客观规律性与主观能动性统一的基础。", "theme": "实践·认识·真理"}, {"text": "尊重客观规律是正确发挥主观能动性的前提。", "theme": "其他"}, {"text": "从实际出发是正确发挥人的主观能动性的前提。", "theme": "其他"}, {"text": "实践是发挥人的主观能动性的根本途径。", "theme": "实践·认识·真理"}, {"text": "世界上的一切事物和现象都是物质和物质的表现。", "theme": "物质·意识·世界"}, {"text": "条件对事物发展和人的活动具有支持或制约作用。", "theme": "辩证法"}, {"text": "条件是可以改变的；改变和创造条件不是任意的，必须尊重事物发展的客观规律。", "theme": "辩证法"}, {"text": "判断一个事物是新事物还是旧事物，并不取决于其形式的新旧与出现时间的先后。", "theme": "物质·意识·世界"}, {"text": "同一性是事物存在和发展的前提。", "theme": "辩证法"}, {"text": "斗争性寓于同一性之中，矛盾的同一性是有条件的、相对的，矛盾的斗争性是无条件的、绝对的。", "theme": "辩证法"}, {"text": "共性寓于个性之中，矛盾的共性是无条件的、绝对的，矛盾的个性是有条件的、相对的。", "theme": "辩证法"}, {"text": "事物的性质是由主要矛盾的主要方面所决定的。", "theme": "辩证法"}, {"text": "量变是质变的必要准备，质变是量变的必然结果，并为新的量变开辟道路。", "theme": "辩证法"}, {"text": "否定是事物的自我否定，是事物内部矛盾运动的结果。", "theme": "物质·意识·世界"}, {"text": "事物的发展呈现出波浪式前进或螺旋式上升的总趋势。", "theme": "其他"}, {"text": "内容是事物存在的基础，对形式具有决定作用。", "theme": "辩证法"}, {"text": "形式对内容具有反作用，形式具有相对独立性。", "theme": "辩证法"}, {"text": "本质决定现象，现象的存在和变化归根到底依赖于本质。", "theme": "辩证法"}, {"text": "现象表现本质，本质总是通过一定的现象表现自己的存在。", "theme": "辩证法"}, {"text": "必然总是伴随着偶然，要通过偶然表现出来，并为自己开辟道路。", "theme": "辩证法"}, {"text": "实践是人类能动地改造世界的社会性的物质活动。", "theme": "物质·意识·世界"}, {"text": "实践是人类生存和发展最基本的活动，是人类社会生活的本质。", "theme": "辩证法"}, {"text": "实践是人的认识产生和发展的基础，也是真理与价值统一的基础。", "theme": "实践·认识·真理"}, {"text": "实践客体与客观存在的事物不完全等同。", "theme": "实践·认识·真理"}, {"text": "实践是认识的起点，也是认识的归宿，是全部认识的基础。", "theme": "实践·认识·真理"}, {"text": "实践是认识的来源，是认识发展的动力，是认识的目的，是检验认识真理性的唯一标准。", "theme": "实践·认识·真理"}, {"text": "实践关系是最根本的关系。", "theme": "实践·认识·真理"}, {"text": "物质生产实践是人类最基本的实践活动。", "theme": "物质·意识·世界"}, {"text": "非理性因素对于人的认识能力和认识活动具有激活、驱动作用。", "theme": "实践·认识·真理"}, {"text": "客观性是真理的本质属性，但是真理的形式又是主观的。", "theme": "辩证法"}, {"text": "真理的客观性决定了真理的一元性。", "theme": "实践·认识·真理"}, {"text": "认识是多元的，但真理是一元的。", "theme": "实践·认识·真理"}, {"text": "真理是内容上的一元性与形式上的多样性的统一。", "theme": "辩证法"}, {"text": "真理和谬误存在着原则界限。", "theme": "实践·认识·真理"}, {"text": "真理是具体的、是全面的，真理的本性在于主观和客观相符合。", "theme": "实践·认识·真理"}, {"text": "实践的直接现实性是它的客观实在性的具体表现。", "theme": "实践·认识·真理"}, {"text": "实践的直接现实性的品格，是实践能够成为检验真理唯一标准的主要根据。", "theme": "实践·认识·真理"}, {"text": "逻辑证明可以起到重要的补充作用，逻辑证明不能取代实践作为检验真理的标准。", "theme": "实践·认识·真理"}, {"text": "逻辑证明只能回答前提与结论的关系是不是符合逻辑的问题，而不能回答结论是不是符合客观实际的问题。", "theme": "实践·认识·真理"}, {"text": "价值离不开主体的需要，也离不开客体的特性。", "theme": "价值·自由"}, {"text": "价值直接与主体相联系，始终以主体为中心。", "theme": "辩证法"}, {"text": "客体对于主体的意义不依赖于主体的主观意识而存在。", "theme": "物质·意识·世界"}, {"text": "价值的主体性依赖于价值的客观性，是以价值的客观性为前提的。", "theme": "价值·自由"}, {"text": "任何成功的实践都是真理尺度和价值尺度的统一，是合规律性和合目的性的统一。", "theme": "实践·认识·真理"}, {"text": "价值尺度必须以真理为前提", "theme": "实践·认识·真理"}, {"text": "自由是对必然的认识和对客观世界的改造。", "theme": "物质·意识·世界"}, {"text": "无论是自然地理环境还是人口因素，都不能脱离社会生产而发生作用，都不能决定社会的性质和社会形态的更替。", "theme": "唯物史观"}, {"text": "生产方式是社会历史发展的决定力量。", "theme": "唯物史观"}, {"text": "物质生产活动及生产方式是人类社会赖以存在和发展的基础，是人类其他一切活动的首要前提。", "theme": "物质·意识·世界"}, {"text": "社会意识根源于社会存在，社会意识是具体的、历史的。", "theme": "物质·意识·世界"}, {"text": "随着社会存在的发展，社会意识也相应地或早或迟地变化和发展。", "theme": "物质·意识·世界"}, {"text": "生产工具是区分社会经济时代的客观依据。", "theme": "唯物史观"}, {"text": "劳动者是生产力中最活跃的因素。", "theme": "唯物史观"}, {"text": "科学技术是生产力中的重要因素。", "theme": "唯物史观"}, {"text": "生产资料所有制关系是最基本的是区分不同生产方式、判定社会经济结构性质的客观依据。", "theme": "唯物史观"}, {"text": "生产关系是社会关系中最基本的关系，在整个上层建筑中，政治上层建筑居主导地位。", "theme": "唯物史观"}, {"text": "社会基本矛盾规定社会发展过程的基本性质和基本趋势，并对社会历史发展起根本推动作用的矛盾。", "theme": "辩证法"}, {"text": "生产力是社会基本矛盾运动中最基本的动力因素，是人类社会发展和进步的最终决定力量。", "theme": "物质·意识·世界"}, {"text": "生产力是社会进步的根本内容，是衡量社会进步的根本尺度。", "theme": "辩证法"}, {"text": "科学技术作为先进生产力的重要标志，是推动社会文明进步的重要力量。", "theme": "唯物史观"}, {"text": "人的本质不是单个人所固有的抽象物，在其现实性上，它是一切社会关系的总和。", "theme": "辩证法"}, {"text": "人的本质属性是社会属性，而不是自然属性；人的本质属性表现在各种社会关系中。", "theme": "辩证法"}, {"text": "人的本质是变化、发展的，而不是永恒不变的。", "theme": "辩证法"}, {"text": "人们自己创造自己的历史。", "theme": "唯物史观"}, {"text": "经济条件对于人民群众创造历史的活动有着首要的、决定性的影响。", "theme": "辩证法"}, {"text": "政治条件具有直接的影响，精神文化条件也是制约人民群众创造历史活动的重要因素。", "theme": "辩证法"}, {"text": "不管什么样的历史人物，在历史上发挥什么样的作用，都要受到社会发展客观规律的制约，而不能决定和改变历史发展的总进程和总方向。", "theme": "唯物史观"}, {"text": "任何历史人物的出现都体现了必然性与偶然性的统一。", "theme": "辩证法"}, {"text": "世界的统一性在于它的物质性，世界统一于物质，世界的物质统一性是多样性的统一。", "theme": "物质·意识·世界"}, {"text": "自然界是物质的；人类依存于自然界，自然界先于人类而存在，并不依赖人类意识而存在。", "theme": "物质·意识·世界"}, {"text": "无论是尚未进入人类实践活动范围的自在自然，还是已经被实践打上烙印的人化自然，都具有客观实在性。", "theme": "物质·意识·世界"}, {"text": "人类社会本质上是生产实践基础上形成的物质体系。", "theme": "物质·意识·世界"}, {"text": "人类社会是物质世界的一部分，是物质存在的一种特定形态。", "theme": "物质·意识·世界"}, {"text": "人类社会的自然基础是物质的，人类获取生活资料的生产活动是物质的。", "theme": "物质·意识·世界"}, {"text": "人的意识统一于物质，意识是物质世界中的一种特殊存在。", "theme": "物质·意识·世界"}, {"text": "世界的物质统一性原理是辩证唯物主义最基本、最核心的观点，是马克思主义的基石。", "theme": "物质·意识·世界"}], "z02": [{"module": "马原", "type": "单多", "text": "21世纪以来资本主义的新变化，并未改变资本主义的经济基础和追求利润最大化的本性。国际金融资本的垄断成为当代资本主义最突出、最鲜明、最主要的特征。当代资本主义变化新特征：（1）科技创新加速资本主义生产方式变化：①产业结构的调整；②生产组织和劳动形式的变化；③新经济形态的出现。（2）国际金融垄断资本主义影响日益显现：①金融垄断寡头化；②金融垄断国际化；③经济虚拟化、产业空心化。（3）社会阶级层级结构呈现复杂性多样化。（4）发达资本主义国家凭借经济、科技、文化传播等超级优势，在世界范围内推行霸权主义和强权政治。记三不记四史纲听3遍毛特听1遍", "title": "当代资本主义的新变化"}, {"module": "毛特", "type": "多选", "text": "推进马克思主义中国化时代化，是马克思主义理论本身发展的内在要求，是解决中国实际问题的客观需要。", "title": "推进马克思主义中国化时代化的原因"}, {"module": "毛特", "type": "单选", "text": "关于新民主主义革命基本思想的提出，标志着毛泽东思想开始萌芽。", "title": "新民主主义革命基本思想 → 毛泽东思想开始萌芽"}, {"module": "毛特", "type": "多选", "text": "正确认识毛泽东思想的历史地位和指导意义，有一个怎样科学评价毛泽东和毛泽东思想的问题。这个问题关系到怎样看待党百年奋斗和前进的历史，关系到党的团结、国家的安定，也关系到党和国家未来的发展前途，不仅有重要的历史意义，而且有重要的现实意义。", "title": "科学评价毛泽东和毛泽东思想的意义"}, {"module": "毛特", "type": "单多", "text": "党在过渡时期的总路线的现实依据：①国家不仅建立起了在国民经济中起领导作用的社会主义国营经济，而且成为整个国民经济进行社会主义改造的重要开端，这为党提出向社会主义过渡的总路线提供了物质基础。②一般规模较小的农业互助合作组织，没有大机器，主要靠协作，也可以增产，这也为党提出向社会主义过渡的总路线提供了重要依据。③出现了一系列从低级到高级的国家资本主义形式，这些本来主要是为了帮助私营工商业克服生产困难而采取的措施，不但对资本主义工商业进行了有效的利用和限制，也很自然地加深了它们同社会主义国营经济之间的联系，这也成为党提出向社会主义过渡的总路线的又一个重要因素。④当时的国际形势也有利于中国向社会主义过渡，这为实行过渡时期总路线提供了有利的国际环境。", "title": "过渡时期总路线的现实依据"}, {"module": "毛特", "type": "单多", "text": "十二大：走自己的道路，建设有中国特色的社会主义。“中国特色社会主义”成为我们党的全部理论和实践创新的主题。十三大：第一次对中国特色社会主义理论进行系统的概括，标志着邓小平理论轮廓的形成。南方谈话是邓小平理论的集大成之作，邓小平理论也逐步走向成熟。解放思想、实事求是，是邓小平理论的精髓。", "title": "十二大 · 十三大 · 南方谈话"}, {"module": "史纲", "type": "单多", "text": "井冈山根据地建立：点燃了工农武装割据的星星之火，为中国革命开辟出了农村包围城市、武装夺取政权这样一条前人没有走过的正确道路。中华苏维埃共和国：中国历史上第一个全国性的工农民主政权，是中国共产党在局部地区执政的重要尝试，扩大了党和红色政权的影响，一定程度上加强了对处于被分割状态的各根据地的中枢指挥作用，推动了各根据地的政权、经济、文化教育和党的自身建设，开创了土地革命战争新局面。", "title": "井冈山根据地与中华苏维埃共和国"}, {"module": "史纲", "type": "单多", "text": "一二九运动：喊出“反对华北自治”“打倒日本帝国主义”“停止内战，一致对外”等口号，促进了中华民族觉醒，标志着中国人民抗日救亡运动新高潮的到来。瓦窑堡会议：①提岀党的基本策略任务是建立广泛的抗日民族统一战线；②批评了党内长期存在的“左”倾冒险主义、关门主义错误倾向；③中国共产党及时提出了抗日民族统一战线的新政策，在新的历史时期即将到来时掌握了政治主动权。", "title": "一二九运动与瓦窑堡会议"}, {"module": "史纲", "type": "多选", "text": "六届七中：①通过了《关于若干历史问题的决议》，对建党以后特别是党的六届四中全会至遵义会议前这一段党的历史及其经验教训进行了总结。②充分肯定了确立毛泽东在全党领导地位的重大意义。③使全党特别是党的高级干部对中国革命基本问题的认识达到了一致，增强了全党团结，为党的七大胜利召开创造了充分条件，有力促进了中国革命事业发展。④整风运动胜利结束。五一口号：得到各民主党派和社会各界的热烈响应，揭开了中国共产党同各党派、各团体、各族各界人士协商建国的序幕，奠定了中国共产党领导的多党合作和政治协商制度的基础。", "title": "六届七中全会与“五一口号”"}, {"module": "史纲", "type": "多选", "text": "面临的困难和问题：①能不能保卫住革命胜利的成果，巩固新生的人民政权。②能不能战胜严重的经济困难，迅速恢复和发展国民经济。③能不能巩固民族独立，维护国家主权和安全。④能不能经受住全国执政的新考验，继续保持优良传统和作风。外交方针：“另起炉灶”、“打扫干净屋子再请客”、“一边倒”。", "title": "建国初期面临的困难与三大外交方针"}, {"module": "史纲", "type": "多选", "text": "“三反”运动：反贪污、反浪费、反官僚主义。这一运动是一场大规模的群众性政治运动，旨在惩治腐败，拒腐防变，保持党的先进性，巩固党的执政地位。“五反”运动：反对行贿、反对偷税漏税、反对盗窃国家财产、反对偷工减料、反对盗窃经济情报的。这一运动促进了社会经济结构的重组，初步改变了私营企业的性质，为资本主义工商业改造和国家大规模经济建设奠定了基础。这些举措对于在执政条件下继续保持共产党人的革命精神和优良作风，密切党和人民群众的联系、增强党的团结，起到了重要的作用。“一五”计划：确定经济建设指导方针，突出了集中主要力量发展重工业，建立国家工业化和国防现代化的初步基础的核心要点。", "title": "三反五反与“一五”计划"}, {"module": "史纲", "type": "多选", "text": "基本制度确立意义：①极大地提高了工人阶级和广大劳动人民的积极性、创造性，为社会生产力的大发展开辟了广阔道路；②为当代中国的一切发展进步提供了根本政治保障；③为社会主义先进文化的发展指明了前进方向。", "title": "社会主义基本制度确立的意义"}, {"module": "史纲", "type": "单多", "text": "起草决议指导原则：①确立毛泽东同志的历史地位，坚持和发展毛泽东思想，这是最核心的一条。②对建国30年来历史上的大事，要进行实事求是的分析，包括一些负责同志的功过是非，要作出公正的评价。③这个总结宜粗不宜细，总结过去是为了引导大家团结一致向前看。", "title": "《历史决议》起草的三条指导原则"}, {"module": "附赠·马哲新增", "type": "选择", "text": "人类的出现，特别是人类改造世界的实践活动，极大地改变了世界的面貌，使世界发生了二重分化，即从自然界中分化出人类社会，从客观世界中分化出主观世界。自然界是亘古存在且不断演化的，人类的出现是自然史上的一个巨大飞跃。这个飞跃的关键在于人的劳动，它在从猿到人的转变中起到了决定性作用，从一定意义上说，“劳动创造了人本身”。可以说，人类社会是最高级的物质存在形态。人类社会与自然界的不同主要在：在自然界中一切都是自发产生的，在人类社会中一切都打着人的意识的印记，是人有目的的实践活动的结果。自然界与人类社会不是截然分开的，而是交叉重叠和相互作用的。在自然界中有“人化自然”，即经过人的改造并体现着人的目的和意志的自然，在社会中有自然物质和自然力的运用。客观世界是不依赖于人的思想意识而存在的现实世界，包括自然界和人类社会。主观世界是指人的意识、观念世界，是人的头脑反映和把握物质世界的精神活动的总和。主观世界从客观世界中分化出来，具有相对独立性。但主观世界并非独立存在的实体，也不是一个超然于客观世界而孤立存在的世界，它不能完全脱离客观世界，而是从属于客观世界。从根本上说，主观世界是对客观世界的反映，并反作用于客观世界。人的实践活动是自然界与人类社会、客观世界与主观世界相分化的关键，也是它们相统一的关键。在实践活动中，人们始终在处理自然与社会、客观与主观的关系，力求克服二者的对立而达成它们的统一。自然与社会、客观与主观的统一是一个动态的历史的过程。", "title": "物质世界的二重化"}, {"module": "附赠·马哲新增", "type": "选择", "text": "人工智能是人的意识能动性的一种特殊表现，是人的本质力量的对象化、现实化。人工智能的出现表明，人类意识已经发展到能够把意识活动部分地从人脑中分离出来，物化为机器的物理运动从而延伸意识器官功能的新阶段。即使是计算能力最强大、最先进的智能机器，也达不到人类智能的层级，无法真正具有人的意识，不可能取代或超越人类智能。①人类意识是知情意的统一体，而人工智能只是对人类的理性智能的模拟和扩展，不具备情感、信念、意志等人类意识形式；②社会性是人的意识所固有的本质属性，而人工智能不可能真正具备人类的社会属性；③人类的自然语言是思维的物质外壳和意识的现实形式，而人工智能难以完全具备理解自然语言真实意义的能力；④人工智能能够获得人类意识中可以化约为数字信号的内容，但人脑中总有许多东西无法被化约的。", "title": "人工智能与人类意识"}, {"module": "附赠·马哲新增", "type": "选择", "text": "社会进步：对社会前进发展的总概括。社会进步主要表现：①社会形态从低级到高级的发展。②同一社会形态内部的发展。社会进步不是直线上升的，而是曲折发展的，有时甚至包含着某些停滞和倒退，但终究改变不了社会进步的总趋势，阻挡不住社会发展的历史进程。社会进步促进人的发展。人的发展：人的体力、智力、个性和交往能力等的发展，其中最根本的是人的自由程度的提高。人的发展程度构成了社会进步的重要标志。唯物史观从社会进步和人的发展的内在联系出发，把人的发展从低级到高级依次概括为三个阶段，即人的依赖关系占统治地位的阶段、以物的依赖关系为基础的人的独立性的阶段、自由个性的阶段。社会进步推动人类解放。人类解放从根本上讲是社会长期发展进步的结果。社会的每一重大进步，对人来说都具有某种解放的意义，是人类走向彻底解放的必要阶梯。真正从必然王国进入自由王国并反映人类解放的光明前途的，是共产主义社会。", "title": "社会进步与人的发展"}, {"module": "附赠·马哲新增", "type": "选分", "text": "文明：人类创造的所有物质成果、精神成果和制度成果的总和，是标志社会进步程度的范畴，反映了人类社会实践活动的积极成果。文明发展的程度，体现了一个民族、国家、社会发展的水平。社会形态的更替，从一定意义上说也是文明形态的更替。共产主义文明是人类全新的文明，社会主义文明是其初级阶段或初级形态。人类历史中的文明，不论是古代文明，还是近现代文明，都在不同民族那里有不同的表现。人类文明具有多样性。世界各国要尊重和保护文明多样性，推动不同文明交流对话、和平共处、和谐共生，以文明交流超越文明隔阂、文明互鉴超越文明冲突、文明共存超越文明优越，共同绘就人类文明美好画卷。", "title": "文明"}, {"module": "附赠·马哲新增", "type": "选分", "text": "文化是推动社会发展的重要力量：文化通常有广义和狭义之分，广义的文化是指人类的社会实践活动及其产物，即人类在物质、精神和制度等方面的创造性活动及其结果，包括人们在实践中创造的物质文明、政治文明和精神文明等。狭义的文化是指人类的精神生产活动及其结果，是与经济、政治相对应的观念形态的文化，是对社会经济、政治的反映。文化蕴含着人类的思想智慧、价值追求和审美情趣，是一个国家、一个民族的灵魂。文化兴则国家兴，文化强则民族强。在当代，文化越来越成为民族复兴和社会发展的重要源泉，越来越成为综合国力竞争的重要因素，丰富精神文化生活和精神世界越来越成为人民群众的热切愿望。文化对社会发展有着巨大的影响。这种影响和作用在其性质上，表现为促进或阻碍社会的发展；在其程度上，表现为加快或延缓社会的发展。在同样的经济、政治条件下，坚持什么样的文化，对于社会发展极为重要。①文化为社会发展提供思想指引。②文化为社会发展提供精神动力。③文化为社会发展提供凝聚力量。文化的核心是价值观，文化是民族的血脉，是人民的精神家园。先进文化为社会发展指明变革方向，促进生产力发展和社会进步。", "title": "文化是推动社会发展的重要力量"}, {"module": "附赠·马哲新增", "type": "分析", "text": "坚持守正创新：人类认识世界和改造世界的过程，是一个不断坚持守正创新，并努力实现理论创新和实践创新良性互动的过程。所谓守正，就是坚持实事求是，坚持真理性认识，坚持正确政治方向。所谓创新，就是坚持解放思想，破除与客观事物进程不相符合的旧观念、旧理论、旧模式、旧做法，在继承历史发展成果的基础上，发现和运用事物的新联系、新规律，更有效地进行认识世界和改造世界的活动。守正创新就是坚持守正与创新的辩证统一。守正与创新是相辅相成的，守正是创新的前提和基础，创新是守正的目的和路径。实践创新为理论创新提供不竭的动力源泉；理论创新为实践创新提供科学的行动指南。理论创新和实践创新相互促进、辩证统一，不断实现更高阶段的创新发展。所谓良性互动是指两者之间存在良好的、积极的相互作用和相互影响，或者说二者之间形成相互激发、共同促进的因果关系。第页", "title": "坚持守正创新"}], "meetings": [{"name": "中共一大", "year": 1921, "points": ["大会确定党的名称为“中国共产党”，通过中国共产党的第一个纲领和决议。", "大会在讨论实际工作计划时，决定首先集中精力组织工人", "大会决定设立中央局作为党的临时领导机构。"], "num": "092"}, {"name": "中共二大", "year": 1922, "points": ["第一次提出了反帝反封建的民主革命的纲领", "开始采取群众路线的方法", "正式提出民主联合战线的主张，这是党最早提出关于统一战线的思想和主张，主要目的是实现反帝反军阀的革命目标"], "num": "092"}, {"name": "中共三大", "year": 1923, "points": ["正式决定全体共产党员以个人名义加入国民党"], "num": "092"}, {"name": "国民党一大", "year": 1924, "points": ["对三民主义作出新的解释，即“新三民主义”", "事实上确认了联俄、联共、扶助农工的三大革命政策", "新三民主义的政纲同当时中共基本一致，因而成为国共合作的政治基础", "标志着第一次国共合作正式形成"], "num": "092"}, {"name": "中共四大", "year": 1925, "points": ["提出了无产阶级在民主革命中的领导权问题", "提出了工农联盟问题", "对民主革命的内容作了更加完整的规定"], "num": "092"}, {"name": "中共五大", "year": 1927, "points": ["提出争取无产阶级对革命的领导权", "建立革命民主政权和实行土地革命等一些正确的原则", "但对无产阶级如何争取革命领导权、如何领导农民实", "行土地革命，特别是如何建立党领导的革命武装等问题，没有提出有效的具体措施，难以承担起挽救革命的任务。"], "num": "092"}, {"name": "八七会议", "year": 1927, "points": ["八七会议总结了大革命失败的经验教训", "巴适", "坚决纠正和结束了陈独秀的右倾主义错误", "确定了土地革命和武装反抗国民党反动派的总方针", "第一次提出了“政权是由枪杆子中取得的”思想"], "num": "092"}, {"name": "古田会议", "year": 1929, "points": ["立了思想建党、政治建军原则", "中心思想是要用无产阶级思想进行军队和党的建设", "阐述了加强党的思想建设的极端重要性，指明党内各种非无产阶级思想的表现、来源及纠正办法", "规定了中国的红军是一个执行革命的政治任务的武装集团", "创造性地解决了在农村环境中、在党组织和军队以农民为主要成分的条件下，如何保持党的无产阶级先锋队性质和建设党领导的新型人民军队的重大问题", "古田先锋军队"], "num": "092"}, {"name": "遵义会议", "year": 1935, "points": ["党的历史上一个生死攸关的转折点", "事实上确立了毛泽东在 /* ---------- 全局搜索 ---------- */
function viewSearch(){
  const k = S.search.trim().toLowerCase();
  if(!k) return '';
  const hit = (t) => String(t||'').toLowerCase().includes(k);
  const out = [];
  cards.forEach(c => { if(hit(c.title)||hit(c.num)||(c.lines||[]).some(hit)||hit(c.mnemonic)) out.push({k:'速记卡 '+c.num, t:c.title+'　'+(c.mnemonic||''), act:'goto', num:c.num}); });
  DATA.mnemonics.forEach(m => { if(hit(m.mnemonic)||hit(m.title)) out.push({k:'口诀 '+m.num, t:m.mnemonic+' → '+m.title, act:'nav', v:'mnem'}); });
  DATA.meetings.forEach(m => { if(hit(m.name)||hit(m.year)||(m.points||[]).some(hit)) out.push({k:'会议 '+m.year, t:m.name+'　'+((m.points||[])[0]||''), act:'nav', v:'timeline'}); });
  quizzes.forEach(q => { if(hit(q.text)) out.push({k:q.kind+' · '+(q.ok?'正确':'错误'), t:q.text, act:'nav', v:'quiz'}); });
  DATA.z02.forEach(z => { if(hit(z.text)||hit(z.title)) out.push({k:'新变 '+z.module, t:(z.title||'')+'　'+z.text.slice(0,60), act:'nav', v:'z02'}); });
  DATA.realexam.hot.forEach(r => { if(hit(r.term)) out.push({k:'真题 '+r.years+'/11 年', t:r.term+'　'+r.module+'　出现 '+r.count+' 次', act:'nav', v:'realexam'}); });
  let h = head('搜索结果：'+esc(S.search),'共 '+out.length+' 条命中。点结果可跳到对应模块。');
  if(!out.length) return h+'<div class="empty">没有找到，换个关键词试试。</div>';
  h += out.slice(0,120).map(o => '<div class="sres" data-act="'+o.act+'" '+(o.num?'data-num="'+esc(o.num)+'"':'')+' '+(o.v?'data-v="'+esc(o.v)+'"':'')+'><span class="k">'+esc(o.k)+'</span>'+esc(o.t.slice(0,110))+'</div>').join('');
  if(out.length>120) h += '<div class="empty">仅显示前 120 条，请缩小关键词。</div>';
  return h;
}

function render(){
  renderNav();
  let h;
  if(S.search.trim()) h = viewSearch();
  else switch(S.view){
    case 'map': h=viewMap(); break;
    case 'cards': h=viewCards(); break;
    case 'timeline': h=viewTimeline(); break;
    case 'quiz': h=viewQuiz(); break;
    case 'mnem': h=viewMnem(); break;
    case 'traps': h=viewTraps(); break;
    case 'z02': h=viewZ02(); break;
    case 'realexam': h=viewRealexam(); break;
    default: h=viewRoutes();
  }
  $('#view').innerHTML = h;
  const sel = $('#chapSel'); if(sel) sel.value = S.chapter;
}

  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act;
  if(a==='nav'){ S.view=el.dataset.v; S.search=''; $('#q').value=''; S.drill=null; if(S.view!=='quiz') S.quiz=null; render(); }
  else if(a==='theme'){ S.theme = S.theme==='light'?'dark':'light'; save(); render(); }
  else if(a==='reset'){ if(confirm('清空已掌握标记、错题本和答题统计？')){ S.known.clear(); S.wrong.clear(); S.qdone=0; S.qright=0; save(); render(); } }
  else if(a==='print'){ window.open('/kaoyan/onepage','_blank'); }
  else if(a==='chap'){ S.chapter=el.dataset.ch; S.view='cards'; S.filter='all'; S.drill=null; render(); window.scrollTo(0,0); }
  else if(a==='goto'){ const c=byNum.get(el.dataset.num); if(c){ S.chapter=c.ch; S.view='cards'; S.filter='all'; S.drill=null; S.search=''; $('#q').value=''; render(); window.scrollTo(0,0); } }
  else if(a==='filter'){ S.filter=el.dataset.f; render(); }
  else if(a==='flip'){ el.classList.toggle('flipped'); }
  else if(a==='known'){ S.known.add(el.dataset.num); save(); render(); }
  else if(a==='unknown'){ S.known.delete(el.dataset.num); save(); render(); }
  else if(a==='drill'){
    let pool = cards.filter(c=>(S.chapter==='全部'||c.ch===S.chapter));
    if(S.filter==='todo') pool=pool.filter(c=>!S.known.has(c.num));
    if(S.filter==='mn') pool=pool.filter(c=>!!c.mnemonic);
    if(!pool.length) pool=cards.slice();
    pool=pool.slice().sort(()=>Math.random()-0.5).slice(0,10);
    S.drill={queue:pool,i:0,show:false}; S.view='cards'; render();
  }
  else if(a==='drill-flip'){ S.drill.show=!S.drill.show; render(); }
  else if(a==='drill-yes'){ S.known.add(S.drill.queue[S.drill.i].num); save(); S.drill.i++; S.drill.show=false; render(); }
  else if(a==='drill-no'){ S.known.delete(S.drill.queue[S.drill.i].num); save(); S.drill.i++; S.drill.show=false; render(); }
  else if(a==='drill-exit'){ S.drill=null; render(); }
  else if(a==='meeting'){ const i=el.dataset.i; S.openMeeting[i]=!S.openMeeting[i]; render(); }
  else if(a==='qmode'){ S.quizOnlyWrong = el.dataset.m==='wrong'; S.quiz=null; render(); }
  else if(a==='qstart'){ startQuiz(); }
  else if(a==='qreset'){ S.quiz=null; render(); }
  else if(a==='answer'){
    const q=S.quiz; if(!q||q.answered) return;
    const item=q.list[q.i], v=el.dataset.v==='1';
    const correct = (v===item.ok);
    q.answered=true; q.fb={ok:correct,text:(correct?'✓ 答对了！':'✗ 记一下：')+' 标准答案：'+(item.ok?'表述正确':'表述错误')+'　【'+item.theme+'】'};
    S.qdone++; if(correct){ S.qright++; q.right++; S.wrong.delete(item.id); } else S.wrong.add(item.id);
    save(); render();
  }
  else if(a==='qnext'){
    const q=S.quiz; if(!q) return;
    if(!q.answered){ q.fb={ok:false,text:'先选一个答案再进入下一题。'}; render(); return; }
    q.i++; q.fb=null; q.answered=false; render();
  }
});
document.addEventListener('change', e => { if(e.target.id==='chapSel'){ S.chapter=e.target.value; S.drill=null; render(); } });
$('#q').addEventListener('input', e => { S.search=e.target.value; render(); });
document.addEventListener('keydown', e => {
  if(e.key==='Escape' && S.search){ S.search=''; $('#q').value=''; render(); return; }
  if(document.activeElement===$('#q')) return;
  if(S.drill && S.view==='cards'){
    if(e.code==='Space'){ e.preventDefault(); S.drill.show=!S.drill.show; render(); }
    else if(e.key==='ArrowRight'){ S.drill.i++; S.drill.show=false; render(); }
  }
});
render();
})();
</script>
