<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1e293b;--sub:#64748b;--line:#e2e8f0;--blue:#2563eb;--blue-d:#1d4ed8;--blue-l:#eff6ff;--shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px 70px}
.hero{background:linear-gradient(135deg,#991b1b 0%,#dc2626 60%,#b45309 100%);color:#fff;border-radius:0 0 28px 28px;padding:44px 30px 36px;box-shadow:var(--shadow)}
.hero a{color:#dbeafe;text-decoration:none;font-size:13px}
.hero .row{display:flex;align-items:center;gap:16px;margin-top:12px}
.hero .ic{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:26px;font-weight:800;flex:none}
.hero h1{margin:0;font-size:28px;font-weight:800}
.hero .sub{color:#e6efff;font-size:13.5px;margin:2px 0 0}
.hero p{margin:12px 0 0;color:#e6efff;font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:thin}
.tab{flex:none;padding:8px 15px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--blue);color:var(--blue-d)}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.panel{display:none}
.panel.on{display:block}
.gdesc{font-size:12.5px;color:var(--sub);margin:14px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);transition:.16s;position:relative}
.card:hover{transform:translateY(-2px);border-color:var(--blue)}
.card h3{margin:0 0 6px;font-size:15px;font-weight:800;padding-right:44px}
.card p{margin:0;font-size:12.5px;color:var(--sub);line-height:1.7}
.badge{position:absolute;right:16px;top:16px;font-size:10px;padding:2px 8px;border-radius:6px;background:var(--blue-l);color:var(--blue-d);font-weight:700}
.planned{opacity:.65}
@media(max-width:600px){.hero h1{font-size:22px}.wrap{padding:0 14px 50px}}
</style>
</head>
<body>

<script>
(function(){
  var G=[{"name": "主界面", "items": [{"title": "主动回忆主界面", "desc": "495 张卡 · 间隔复习 · 错题本 · 统计", "href": "/kaoyan/politics/app", "badge": "每日"}]}, {"name": "主动回忆与速记", "items": [{"title": "主动回忆", "desc": "495 张 · 间隔复习 · 错题本 · 统计", "href": "/kaoyan/politics/app", "badge": "每日", "icon": "cards"}, {"title": "知识地图", "desc": "七大板块 · 会议时间轴 · 真题热度", "href": "/kaoyan/jisu", "icon": "map"}, {"title": "考前 30 分钟", "desc": "A4 三栏打印版，进考场前扫一遍", "href": "/kaoyan/onepage", "icon": "clock"}, {"title": "卡片下载", "desc": "Anki / 墨墨 CSV · 全量备份", "href": "#", "icon": "download"}, {"title": "真题与资料索引", "desc": "2016—2026 真题解析 · 一页纸手册 · 全科目索引", "href": "#/", "badge": "索引", "icon": "map"}]}, {"name": "模拟题 · 肖八（2027 版）", "items": [{"title": "肖八 · 逐题精练", "desc": "刷题主界面 · 264 道选择题 · 答错可一键跳同考点历年真题", "href": "#/", "badge": "新增", "icon": "cards"}, {"title": "肖八 · 错题本", "desc": "只刷答错与模糊的题 · 上次进度打开即恢复", "href": "#/#mode=wrong", "icon": "dice"}]}, {"name": "真题 · 解题方法 · 知识点", "items": [{"title": "知识点一页纸 · 100 条", "desc": "知识点册全 35 页 · 100 个编号逐条完整收录 · Z02 新变考点 / Z03 全年时政 / 肖八精简考点", "href": "/kaoyan/realexam/#knowledge", "badge": "核心", "icon": "map"}, {"title": "解题方法 · 73 条", "desc": "墓碑词 / 绝对化 / 时态 / 夸张 · 先认标志词，再按错因刷同类题", "href": "/kaoyan/realexam/#methods", "badge": "重点", "icon": "map"}, {"title": "真题考点专项 / 我的薄弱考点", "desc": "11 套卷 · 377 道真题 + 2 道模拟 · 48 个恒重考点；由肖八错题自动推荐", "href": "/kaoyan/realexam/#weak", "icon": "dice"}]}];
  var tabs=document.getElementById('tabs'),panels=document.getElementById('panels');
  G.forEach(function(g,i){
    var b=document.createElement('button');b.className='tab'+(i===0?' on':'');b.textContent=g.name;
    b.onclick=function(){Array.prototype.forEach.call(tabs.children,function(x){x.classList.remove('on')});b.classList.add('on');
      Array.prototype.forEach.call(panels.children,function(x){x.classList.remove('on')});panels.children[i].classList.add('on');};
    tabs.appendChild(b);
    var p=document.createElement('div');p.className='panel'+(i===0?' on':'');
    var items=g.items.map(function(it){
      if(it.status==='planned')return '<div class="card planned"><span class="badge">规划中</span><h3>'+it.title+'</h3><p>'+(it.note||'筹备中')+'</p></div>';
      return '<a class="card" href="'+it.href+'">'+(it.badge?'<span class="badge">'+it.badge+'</span>':'')+'<h3>'+it.title+'</h3><p>'+it.desc+'</p></a>';
    }).join('');
    p.innerHTML='<div class="gdesc">'+g.name+' · 共 '+g.items.length+' 项</div><div class="grid">'+items+'</div>';
    panels.appendChild(p);
  });
})();
</script>
